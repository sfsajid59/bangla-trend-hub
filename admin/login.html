<!DOCTYPE html>
<html lang="bn">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Admin Login - Bangla Trend Hub</title>

    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
..<script src="../assets/supabase.js"></script>

    <style>
        * {
            box-sizing: border-box;
        }

        body {
            margin: 0;
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            background: #111827;
            font-family: Arial, sans-serif;
        }

        .login-box {
            width: 90%;
            max-width: 400px;
            background: #ffffff;
            padding: 30px;
            border-radius: 15px;
        }

        h1 {
            text-align: center;
            margin-bottom: 25px;
        }

        input {
            width: 100%;
            padding: 14px;
            margin-bottom: 15px;
            border: 1px solid #ddd;
            border-radius: 8px;
            font-size: 16px;
        }

        button {
            width: 100%;
            padding: 14px;
            border: 0;
            border-radius: 8px;
            background: #16a34a;
            color: white;
            font-size: 16px;
            cursor: pointer;
        }

        #message {
            margin-top: 15px;
            text-align: center;
        }
    </style>
</head>

<body>

<div class="login-box">

    <h1>Admin Login</h1>

    <form id="loginForm">

        <input
            type="email"
            id="email"
            placeholder="Email"
            required
        >

        <input
            type="password"
            id="password"
            placeholder="Password"
            required
        >

        <button type="submit">
            Login
        </button>

    </form>

    <div id="message"></div>

</div>


<script>

const loginForm = document.getElementById("loginForm");
const message = document.getElementById("message");

loginForm.addEventListener("submit", async (e)=> {
                           
e.preventDefault();

const email =
  document.getElementById("email").value.trim();

const password =
  document.getElementById("password").value;

message.textContent = "Login হচ্ছে...";

try {

  // 1. Supabase Authentication
  const { data, error } =
    await supabaseClient.auth.signInWithPassword({
      email: email,
      password: password
    });

  if (error) {
    message.textContent = error.message;
    return;
  }

  if (!data || !data.user) {
    message.textContent = "Login সফল হয়নি।";
    return;
  }

  message.textContent =
    "Login সফল হয়েছে। Admin যাচাই হচ্ছে...";

  // 2. Admin permission check
  const {
    data: adminResult,
    error: adminError
  } = await supabaseClient.rpc("is_admin");

  if (adminError) {

    console.error(
      "is_admin RPC error:",
      adminError
    );

    message.textContent =
      "Admin যাচাই করতে সমস্যা হয়েছে: " +
      adminError.message;

    await supabaseClient.auth.signOut();

    return;
  }

  if (adminResult !== true) {

    message.textContent =
      "এই account-এ Admin permission নেই।";

    await supabaseClient.auth.signOut();

    return;
  }

  // 3. Everything OK
  message.textContent =
    "Login সফল! Dashboard-এ নেওয়া হচ্ছে...";

  window.location.href = "./dashboard.html";

} catch (err) {

  console.error("Login error:", err);

  message.textContent =
    "Login করতে সমস্যা হয়েছে: " +
    (err.message || "Unknown error");
}

</script>

</body>
</html>

<!DOCTYPE html>
<html lang="bn">

<head>

    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0"
    >

    <title>Admin Dashboard - Bangla Trend Hub</title>

    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

    <script src="../assets/js/supabase.js"></script>

    <script src="../assets/js/auth.js"></script>

    <style>

        * {
            box-sizing: border-box;
        }

        body {
            margin: 0;
            background: #f3f4f6;
            font-family: Arial, sans-serif;
        }

        header {
            background: #111827;
            color: white;
            padding: 18px;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        header h1 {
            margin: 0;
            font-size: 20px;
        }

        .logout {
            background: #dc2626;
            color: white;
            border: 0;
            padding: 10px 15px;
            border-radius: 7px;
        }

        main {
            padding: 20px;
        }

        .card {
            background: white;
            padding: 20px;
            border-radius: 12px;
            margin-bottom: 20px;
        }

    </style>

</head>


<body>

<header>

    <h1>Bangla Trend Hub — Admin</h1>

    <button
        class="logout"
        onclick="logout()"
    >
        Logout
    </button>

</header>


<main>

    <div class="card">

        <h2>Admin Dashboard</h2>

        <p id="adminEmail">
            Loading...
        </p>

    </div>

    <div class="card">

    <h2>নতুন Article Publish করুন</h2>

    <input id="postTitle" type="text" placeholder="Article Title">

    <input id="postSlug" type="text" placeholder="Slug">

    <textarea id="postExcerpt" placeholder="সংক্ষিপ্ত বিবরণ"></textarea>

    <input id="postCategory" type="text" placeholder="Category">

    <textarea id="postContent" placeholder="Article Content"></textarea>

    <button onclick="publishPost()">
        Publish Article
    </button>

    <p id="publishMessage"></p>

</div>


</main>


<script>
    async function publishPost() {

    const title = document.getElementById("postTitle").value.trim();
    const slug = document.getElementById("postSlug").value.trim();
    const excerpt = document.getElementById("postExcerpt").value.trim();
    const category = document.getElementById("postCategory").value.trim();
    const content = document.getElementById("postContent").value.trim();

    const message = document.getElementById("publishMessage");

    if (!title || !slug || !excerpt || !category || !content) {
        message.textContent = "সব ঘর পূরণ করুন।";
        return;
    }

    const { data, error } = await supabase
        .from("posts")
        .insert([
            {
                title: title,
                slug: slug,
                excerpt: excerpt,
                category: category,
                content: content,
                status: "published"
            }
        ])
        .select();

    if (error) {
        console.error(error);
        message.textContent = "Publish হয়নি: " + error.message;
        return;
    }

    message.textContent = "✅ Article সফলভাবে Publish হয়েছে!";

    document.getElementById("postTitle").value = "";
    document.getElementById("postSlug").value = "";
    document.getElementById("postExcerpt").value = "";
    document.getElementById("postCategory").value = "";
    document.getElementById("postContent").value = "";
}

async function startAdmin() {

    const allowed = await requireAdmin();

    if (!allowed) {
        return;
    }

    const user = await getCurrentUser();

    document.getElementById("adminEmail").textContent =
        "Logged in as: " + user.email;
}

startAdmin();

</script>


</body>

</html>
